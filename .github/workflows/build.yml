name: Test and build Windows Rust
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: croptix-patcher-windows-x64
          path: target/release/croptix-patcher.exe
